<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <style>
      .wire { stroke: #38bdf8; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .component { stroke: #f8fafc; stroke-width: 2.5; fill: none; }
      .bjt-body { stroke: #818cf8; stroke-width: 3; fill: none; }
      .bjt-bar { stroke: #818cf8; stroke-width: 4; stroke-linecap: round; }
      .arrow { fill: #f43f5e; stroke: #f43f5e; stroke-width: 1.5; }
      .text-label { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: #f8fafc; font-weight: 600; }
      .text-sub { font-size: 11px; fill: #94a3b8; }
      .node { fill: #38bdf8; stroke: #0f172a; stroke-width: 2; }
      .ground { stroke: #94a3b8; stroke-width: 2.5; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="600" height="340" fill="#0f172a" rx="12" stroke="#334155" stroke-width="1.5"/>

  <!-- Title Badge -->
  <rect x="20" y="16" width="280" height="26" fill="#1e293b" rx="6" stroke="#475569"/>
  <text x="30" y="34" class="text-label" fill="#38bdf8" font-size="12">FIGURE 1: NPN BJT in CE Configuration</text>

  <!-- BJT Transistor Symbol -->
  <!-- Circle around transistor -->
  <circle cx="300" cy="170" r="38" stroke="#475569" stroke-dasharray="3,3" fill="#1e293b" fill-opacity="0.5"/>
  <!-- Base vertical bar -->
  <line x1="285" y1="145" x2="285" y2="195" class="bjt-bar"/>
  <!-- Base lead -->
  <line x1="230" y1="170" x2="285" y2="170" class="wire"/>
  <text x="260" y="162" class="text-label">B</text>

  <!-- Collector slanted lead -->
  <line x1="285" y1="155" x2="315" y2="135" class="bjt-body"/>
  <line x1="315" y1="135" x2="315" y2="80" class="wire"/>
  <text x="325" y="130" class="text-label">C</text>

  <!-- Emitter slanted lead with arrow -->
  <line x1="285" y1="185" x2="315" y2="205" class="bjt-body"/>
  <polygon points="315,205 304,198 308,206" class="arrow"/>
  <line x1="315" y1="205" x2="315" y2="270" class="wire"/>
  <text x="325" y="225" class="text-label">E</text>

  <!-- Collector Resistor RC -->
  <!-- Resistor zigzag -->
  <path d="M 315,80 L 310,72 L 320,64 L 310,56 L 320,48 L 315,40" class="component"/>
  <line x1="315" y1="40" x2="315" y2="25" class="wire"/>
  <circle cx="315" cy="25" r="3.5" class="node"/>
  <text x="330" y="60" class="text-label">RC</text>
  <text x="330" y="28" class="text-label" fill="#f43f5e">+VCC (12V)</text>

  <!-- Base Resistor RB -->
  <path d="M 230,170 L 222,165 L 214,175 L 206,165 L 198,175 L 190,170" class="component"/>
  <line x1="190" y1="170" x2="140" y2="170" class="wire"/>
  <text x="200" y="155" class="text-label">RB</text>

  <!-- Input Battery VBB -->
  <line x1="140" y1="170" x2="140" y2="200" class="wire"/>
  <!-- Long plate -->
  <line x1="125" y1="200" x2="155" y2="200" stroke="#f8fafc" stroke-width="3"/>
  <!-- Short plate -->
  <line x1="132" y1="208" x2="148" y2="208" stroke="#f8fafc" stroke-width="4"/>
  <line x1="140" y1="208" x2="140" y2="270" class="wire"/>
  <text x="90" y="206" class="text-label">VBB</text>
  <text x="145" y="196" class="text-sub" fill="#34d399">+</text>
  <text x="145" y="220" class="text-sub" fill="#f43f5e">-</text>

  <!-- Common Ground Bus -->
  <line x1="140" y1="270" x2="480" y2="270" class="wire"/>
  <circle cx="315" cy="270" r="3.5" class="node"/>
  <line x1="315" y1="270" x2="315" y2="295" class="wire"/>
  <!-- Ground symbol -->
  <line x1="300" y1="295" x2="330" y2="295" class="ground"/>
  <line x1="305" y1="302" x2="325" y2="302" class="ground"/>
  <line x1="310" y1="309" x2="320" y2="309" class="ground"/>
  <text x="325" y="315" class="text-sub">COMMON GND</text>

  <!-- Current Direction Indicators -->
  <!-- IB arrow -->
  <path d="M 240,170 L 260,170" stroke="#f59e0b" stroke-width="2" marker-end="url(#arr-ib)"/>
  <text x="245" y="190" class="text-label" fill="#f59e0b">IB →</text>

  <!-- IC arrow -->
  <text x="325" y="105" class="text-label" fill="#34d399">↓ IC</text>

  <!-- IE arrow -->
  <text x="325" y="255" class="text-label" fill="#f43f5e">↓ IE</text>

  <!-- Output Port -->
  <circle cx="480" cy="115" r="3.5" class="node"/>
  <line x1="315" y1="115" x2="480" y2="115" class="wire"/>
  <text x="490" y="120" class="text-label" fill="#38bdf8">VOUT (Collector)</text>
  <circle cx="480" cy="270" r="3.5" class="node"/>
  <text x="490" y="275" class="text-label" fill="#94a3b8">GND</text>
  <text x="420" y="200" class="text-label" fill="#818cf8">VCE</text>
</svg>
